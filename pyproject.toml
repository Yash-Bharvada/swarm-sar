[project]
name = "swarm-sar"
version = "0.6.0"
description = "Deterministic multi-rover search-and-rescue grid simulation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
    "pygame",
    "matplotlib",
    "pytest",
    "gymnasium>=1.0",
    "pettingzoo>=1.24",
    "networkx>=3.2",
    "ray[rllib]==2.59.0",
    "torch==2.14.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
