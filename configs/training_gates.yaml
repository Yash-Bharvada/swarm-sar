version: 1
hard_abort:
  max_invalid_actions: 0
  max_collisions_per_evaluation: 1000
quality:
  max_dominant_action_ratio: 0.985
  plateau_evaluations: 4
  minimum_recall_improvement: 0.01
stages:
  - name: 250k_sanity
    env_steps: 250000
    min_mean_recall: 0.05
    min_worst_recall: 0.0
    min_worst_coverage: 0.05
  - name: 1m_learning
    env_steps: 1000000
    min_mean_recall: 0.25
    min_worst_recall: 0.05
    min_worst_coverage: 0.15
  - name: 2m_robustness
    env_steps: 2000000
    min_mean_recall: 0.45
    min_worst_recall: 0.15
    min_worst_coverage: 0.25
  - name: 5m_candidate
    env_steps: 5000000
    min_mean_recall: 0.65
    min_worst_recall: 0.35
    min_worst_coverage: 0.35
